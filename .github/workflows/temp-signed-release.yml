name: BATTLE UNIVERSE — RELEASE com assinatura temporária
on:
  push:
    branches:
      - release/temp-signature-20261121
permissions:
  contents: write
concurrency:
  group: battle-universe-temp-release
  cancel-in-progress: false
jobs:
  build:
    name: Android RELEASE + Season 02 (assinatura temporária)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install server and content-pack dependencies
        run: |
          python -m pip install --disable-pip-version-check -r server/requirements.txt numpy pillow
      - name: Validate server
        run: |
          python -m compileall -q server
          python -m unittest discover -s server/tests -v
      - name: Build Season 02 external content pack
        run: python scripts/build_content_pack.py
      - name: Verify 1–5 GiB pack and manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, json
          pack = Path("build/battle-universe-season-02-pack.zip")
          manifest_path = Path("build/content-pack-manifest.json")
          assert pack.is_file() and manifest_path.is_file(), "Pacote ou manifesto ausente"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          size = pack.stat().st_size
          assert manifest["version"] == 3, "Versão do pacote inesperada"
          assert 1024**3 <= size <= 5*1024**3, f"Tamanho fora de 1–5 GiB: {size}"
          assert manifest["size_bytes"] == size, "Tamanho diverge do manifesto"
          digest = hashlib.sha256()
          with pack.open("rb") as stream:
              for chunk in iter(lambda: stream.read(4*1024*1024), b""): digest.update(chunk)
          assert digest.hexdigest() == manifest["sha256"], "SHA-256 inválido"
          with ZipFile(pack) as archive:
              assert archive.testzip() is None, "ZIP corrompido"
              assert "manifest.json" in archive.namelist(), "Manifesto interno ausente"
          print(f"Pacote validado: {size} bytes; SHA-256 {digest.hexdigest()}")
          PY
      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate one-time temporary signing key
        run: |
          set -euo pipefail
          STORE_PASS="$(openssl rand -hex 24)"
          KEY_PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/bu-temp-release.jks" -storepass "$STORE_PASS" -keypass "$KEY_PASS" -alias bu-temp-release -keyalg RSA -keysize 2048 -validity 30 -dname "CN=BATTLE UNIVERSE TEMPORARY, OU=TEST, O=BATTLE UNIVERSE, L=Miguel Calmon, ST=Bahia, C=BR"
          {
            echo "BU_KEYSTORE_PATH=$RUNNER_TEMP/bu-temp-release.jks"
            echo "BU_KEYSTORE_PASSWORD=$STORE_PASS"
            echo "BU_KEY_ALIAS=bu-temp-release"
            echo "BU_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/bu-temp-release.jks" -storepass "$STORE_PASS" -alias bu-temp-release >/dev/null
      - name: Build Android RELEASE APK and run unit tests
        env:
          ACCOUNT_API_BASE_URL: https://battle-universe-accounts.onrender.com
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleRelease
      - name: Verify signed RELEASE APK and external pack separation
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          apksigner verify --verbose "$APK"
          test "$(apkanalyzer manifest debuggable "$APK")" = "false"
          test "$(apkanalyzer manifest application-id "$APK")" = "com.battleuniverse.game"
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          apk=Path("app/build/outputs/apk/release/app-release.apk")
          with ZipFile(apk) as z:
              names=set(z.namelist())
              assert "classes.dex" in names
              assert "lib/arm64-v8a/libbattleuniverse.so" in names
              assert "lib/armeabi-v7a/libbattleuniverse.so" in names
              assert "assets/season02.zip" not in names
              assert "assets/season02-manifest.json" not in names
              assert z.testzip() is None
          assert apk.stat().st_size < 300_000_000
          print(f"APK RELEASE temporariamente assinado: {apk.stat().st_size} bytes")
          PY
      - name: Publish separate temporary-signature Release with APK + 1 GiB pack
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: data-pack-v3-temp-signature
          name: Battle Universe — RELEASE temporária + Season 02 (1 GiB)
          body: |
            BUILD RELEASE Android verdadeiro (não Debug), assinado com chave temporária de CI.
            IMPORTANTE: esta assinatura é descartável e NÃO atualiza instalações assinadas pela chave oficial.
            Inclui app-release.apk, pacote Season 02 externo (1–5 GiB) e manifesto SHA-256.
            A Release oficial data-pack-v3 e a chave permanente não foram alteradas.
          prerelease: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            build/battle-universe-season-02-pack.zip
            build/content-pack-manifest.json
          overwrite_files: true
          fail_on_unmatched_files: true
