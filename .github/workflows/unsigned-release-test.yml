name: BATTLE UNIVERSE — Unsigned Release Test

on:
  push:
    branches:
      - test/unsigned-release-20261121

permissions:
  contents: read

concurrency:
  group: battle-universe-unsigned-release-test
  cancel-in-progress: true

jobs:
  build-unsigned:
    name: Build unsigned Android RELEASE for diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests and build unsigned RELEASE APK
        env:
          ACCOUNT_API_BASE_URL: https://battle-universe-accounts.onrender.com
        run: |
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleRelease

      - name: Verify unsigned APK structure
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -s "$APK" ]; then
            APK="app/build/outputs/apk/release/app-release.apk"
          fi
          test -s "$APK"
          test "$(apkanalyzer manifest application-id "$APK")" = "com.battleuniverse.game"
          test "$(apkanalyzer manifest debuggable "$APK")" = "false"
          echo "Unsigned RELEASE APK generated: $(stat -c%s "$APK") bytes"
          echo "This diagnostic APK is not signed and is not suitable for installation/update."

      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: battle-universe-release-unsigned-test
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
