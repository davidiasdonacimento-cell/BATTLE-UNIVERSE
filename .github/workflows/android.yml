name: BATTLE UNIVERSE Android
on:
  push:
    branches: [ main, integrated-season02-online-royale ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: battle-universe-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Native Android RELEASE build and content pack
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install server and content-pack dependencies
        run: |
          python -m pip install --disable-pip-version-check -r server/requirements.txt numpy pillow
      - name: Validate account server and game service tests
        run: |
          python -m compileall -q server
          python -m unittest discover -s server/tests -v
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and test DEBUG APKs before RELEASE signing
        env:
          ACCOUNT_API_BASE_URL: ${{ secrets.ACCOUNT_API_BASE_URL || 'https://battle-universe-accounts.onrender.com' }}
          ADMIN_API_BASE_URL: ${{ secrets.ADMIN_API_BASE_URL }}
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :admin:assembleDebug
      - name: Verify DEBUG game APK
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          assert apk.is_file() and apk.stat().st_size > 0, "APK DEBUG não foi gerado"
          with ZipFile(apk) as z:
              names = set(z.namelist())
              assert "classes.dex" in names, "DEX ausente no APK DEBUG"
              assert "lib/arm64-v8a/libbattleuniverse.so" in names, "Engine ARM64 ausente"
              assert "lib/armeabi-v7a/libbattleuniverse.so" in names, "Engine ARMv7 ausente"
              assert z.testzip() is None, "APK DEBUG corrompido"
          print(f"APK DEBUG verificado: {apk.stat().st_size} bytes")
          PY
      - name: Build expanded Season 02 4K content package
        run: python scripts/build_content_pack.py
      - name: Verify external Season 02 package (1–5 GiB)
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, json
          pack = Path("build/battle-universe-season-02-pack.zip")
          manifest_path = Path("build/content-pack-manifest.json")
          assert pack.is_file() and manifest_path.is_file(), "Pacote externo ou manifesto ausente"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          size = pack.stat().st_size
          assert manifest["version"] == 3, "Versão da Season 02 inesperada"
          assert 1024**3 <= size <= 5*1024**3, f"Pacote fora de 1–5 GiB: {size}"
          assert manifest["size_bytes"] == size, "Tamanho não confere com manifesto"
          digest = hashlib.sha256()
          with pack.open("rb") as stream:
              for chunk in iter(lambda: stream.read(4*1024*1024), b""): digest.update(chunk)
          assert digest.hexdigest() == manifest["sha256"], "SHA-256 externo inválido"
          with ZipFile(pack) as archive:
              assert archive.testzip() is None, "ZIP externo corrompido"
              assert "manifest.json" in archive.namelist(), "Manifesto interno ausente"
          print(f"Season 02 externo validado: {size} bytes / SHA-256 {digest.hexdigest()}")
          PY
      - name: Verify DEBUG game APK
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import subprocess
          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          assert apk.is_file() and apk.stat().st_size > 0, "APK DEBUG não foi gerado"
          with ZipFile(apk) as z:
              names = set(z.namelist())
              assert "classes.dex" in names, "DEX ausente no APK DEBUG"
              assert "lib/arm64-v8a/libbattleuniverse.so" in names, "Engine ARM64 ausente"
              assert "lib/armeabi-v7a/libbattleuniverse.so" in names, "Engine ARMv7 ausente"
              assert z.testzip() is None, "APK DEBUG corrompido"
          app_id = subprocess.check_output(["apkanalyzer", "manifest", "application-id", str(apk)], text=True).strip()
          debuggable = subprocess.check_output(["apkanalyzer", "manifest", "debuggable", str(apk)], text=True).strip()
          assert app_id == "com.battleuniverse.game.debug", f"Application ID inesperado: {app_id}"
          assert debuggable == "true", f"APK não está marcado como DEBUG: {debuggable}"
          print(f"APK DEBUG verificado: {apk.stat().st_size} bytes; applicationId={app_id}")
          PY
      - name: Build expanded Season 02 4K content package
        run: python scripts/build_content_pack.py
      - name: Verify external Season 02 package (1–5 GiB)
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, json
          pack = Path("build/battle-universe-season-02-pack.zip")
          manifest_path = Path("build/content-pack-manifest.json")
          assert pack.is_file() and manifest_path.is_file(), "Pacote externo ou manifesto ausente"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          size = pack.stat().st_size
          assert manifest["version"] == 3, "Versão da Season 02 inesperada"
          assert 1024**3 <= size <= 5*1024**3, f"Pacote fora de 1–5 GiB: {size}"
          assert manifest["size_bytes"] == size, "Tamanho não confere com manifesto"
          digest = hashlib.sha256()
          with pack.open("rb") as stream:
              for chunk in iter(lambda: stream.read(4*1024*1024), b""): digest.update(chunk)
          assert digest.hexdigest() == manifest["sha256"], "SHA-256 externo inválido"
          with ZipFile(pack) as archive:
              assert archive.testzip() is None, "ZIP externo corrompido"
              assert "manifest.json" in archive.namelist(), "Manifesto interno ausente"
          print(f"Season 02 externo validado: {size} bytes / SHA-256 {digest.hexdigest()}")
          PY
      - name: Prepare downloadable DEBUG build
        run: |
          mkdir -p build/distribution
          cp app/build/outputs/apk/debug/app-debug.apk build/distribution/Battle-Universe-debug.apk
          cp build/battle-universe-season-02-pack.zip build/distribution/
          cp build/content-pack-manifest.json build/distribution/
          ls -lh build/distribution/
      - name: Upload DEBUG APK separately
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: battle-universe-debug-apk
          path: build/distribution/Battle-Universe-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload Season 02 package separately
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: battle-universe-season02-pack
          path: |
            build/distribution/battle-universe-season-02-pack.zip
            build/distribution/content-pack-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
