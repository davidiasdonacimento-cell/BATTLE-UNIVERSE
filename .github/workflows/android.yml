name: BATTLE UNIVERSE Android
on:
  push:
    branches: [ main, integrated-season02-online-royale, feature/season02-download-file-analyzer, feature/single-apk-season02 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: battle-universe-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Native Android RELEASE build and content pack
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install server and content-pack dependencies
        run: |
          python -m pip install --disable-pip-version-check -r server/requirements.txt numpy pillow
      - name: Validate account server and game service tests
        run: |
          python -m compileall -q server
          python -m unittest discover -s server/tests -v
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and embed Season 02 inside the APK
        run: python scripts/build_content_pack.py
      - name: Compile and test DEBUG APKs before RELEASE signing
        env:
          ACCOUNT_API_BASE_URL: ${{ secrets.ACCOUNT_API_BASE_URL || 'https://battle-universe-accounts.onrender.com' }}
          ADMIN_API_BASE_URL: ${{ secrets.ADMIN_API_BASE_URL }}
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :admin:assembleDebug
      - name: Verify DEBUG game APK with embedded Season 02 (maximum 450 MiB)
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          assert apk.is_file() and 0 < apk.stat().st_size <= 450*1024*1024, f"APK DEBUG ausente ou acima de 450 MiB: {apk.stat().st_size if apk.exists() else 0}"
          with ZipFile(apk) as z:
              names = set(z.namelist())
              assert "classes.dex" in names, "DEX ausente no APK DEBUG"
              assert "assets/season02/battle-universe-season-02-pack.zip" in names, "Season 02 não foi incluída no APK"
              assert "assets/season02/content-pack-manifest.json" in names, "Manifesto Season 02 não foi incluído no APK"
              assert "lib/arm64-v8a/libbattleuniverse.so" in names, "Engine ARM64 ausente"
              assert "lib/armeabi-v7a/libbattleuniverse.so" in names, "Engine ARMv7 ausente"
              assert z.testzip() is None, "APK DEBUG corrompido"
          print(f"APK DEBUG verificado: {apk.stat().st_size} bytes")
          PY
      - name: Verify optimized RELEASE APK with embedded Season 02 (maximum 450 MiB)
        run: |
          python - <<'PY'
          from pathlib import Path
          apks = list(Path("app/build/outputs/apk/release").glob("app-release*.apk"))
          assert apks, "APK RELEASE não foi gerado"
          for apk in apks:
              size = apk.stat().st_size
              assert 0 < size <= 450*1024*1024, f"APK RELEASE acima de 450 MiB: {size}"
              print(f"APK RELEASE verificado: {size} bytes")
          PY
      - name: Verify embedded Season 02 source package (maximum 400 MiB)
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, json
          pack = Path("build/battle-universe-season-02-pack.zip")
          manifest_path = Path("build/content-pack-manifest.json")
          assert pack.is_file() and manifest_path.is_file(), "Pacote externo ou manifesto ausente"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          size = pack.stat().st_size
          assert manifest["version"] == 4, "Versão da Season 02 inesperada"
          assert 1024**2 <= size <= 400*1024**2, f"Pacote fora do limite de 1 MiB–400 MiB: {size}"
          assert manifest["size_bytes"] == size, "Tamanho não confere com manifesto"
          digest = hashlib.sha256()
          with pack.open("rb") as stream:
              for chunk in iter(lambda: stream.read(4*1024*1024), b""): digest.update(chunk)
          assert digest.hexdigest() == manifest["sha256"], "SHA-256 externo inválido"
          with ZipFile(pack) as archive:
              assert archive.testzip() is None, "ZIP externo corrompido"
              assert "manifest.json" in archive.namelist(), "Manifesto interno ausente"
          print(f"Season 02 mobile validado: {size/1024/1024:.1f} MiB / SHA-256 {digest.hexdigest()}")
          PY
      - name: Prepare single-APK distribution
        run: |
          mkdir -p build/distribution
          cp app/build/outputs/apk/debug/app-debug.apk build/distribution/Battle-Universe-debug-single.apk
          ls -lh build/distribution/
      - name: Upload DEBUG APK separately
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: battle-universe-debug-apk
          path: build/distribution/Battle-Universe-debug-single.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
