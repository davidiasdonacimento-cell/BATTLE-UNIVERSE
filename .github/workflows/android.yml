name: BATTLE UNIVERSE Android
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: battle-universe-android-main
  cancel-in-progress: true
jobs:
  build:
    name: Native Android build and content pack
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure stable APK signing (optional)
        env:
          BATTLE_UNIVERSE_KEYSTORE_BASE64: ${{ secrets.BATTLE_UNIVERSE_KEYSTORE_BASE64 }}
          BATTLE_UNIVERSE_KEYSTORE_PASSWORD: ${{ secrets.BATTLE_UNIVERSE_KEYSTORE_PASSWORD }}
          BATTLE_UNIVERSE_KEY_ALIAS: ${{ secrets.BATTLE_UNIVERSE_KEY_ALIAS }}
          BATTLE_UNIVERSE_KEY_PASSWORD: ${{ secrets.BATTLE_UNIVERSE_KEY_PASSWORD }}
        run: |
          if [ -n "$BATTLE_UNIVERSE_KEYSTORE_BASE64" ]; then
            printf '%s' "$BATTLE_UNIVERSE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/battle-universe.jks"
            {
              echo "BU_KEYSTORE_PATH=$RUNNER_TEMP/battle-universe.jks"
              echo "BU_KEYSTORE_PASSWORD=$BATTLE_UNIVERSE_KEYSTORE_PASSWORD"
              echo "BU_KEY_ALIAS=$BATTLE_UNIVERSE_KEY_ALIAS"
              echo "BU_KEY_PASSWORD=$BATTLE_UNIVERSE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Stable APK signing key loaded."
          else
            echo "No stable signing key: GitHub's temporary debug key will be used."
          fi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install content pack tools
        run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Validate account server Python syntax
        run: python -m compileall -q server
      - name: Build expanded Season 02 4K content package
        run: python scripts/build_content_pack.py
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile game and administration APKs
        env:
          ACCOUNT_API_BASE_URL: ${{ secrets.ACCOUNT_API_BASE_URL }}
          ADMIN_API_BASE_URL: ${{ secrets.ADMIN_API_BASE_URL }}
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :admin:assembleDebug
      - name: Verify game and administration APKs
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          from shutil import copy2
          game = Path("app/build/outputs/apk/debug/app-debug.apk")
          admin_candidates = sorted(Path("admin/build/outputs/apk").rglob("*.apk"))
          assert game.is_file() and game.stat().st_size > 300_000, "APK do jogo ausente ou pequeno"
          assert admin_candidates, "Gradle não gerou APK administrativo"
          admin_source = admin_candidates[0]
          assert admin_source.stat().st_size > 100_000, f"APK administrativo pequeno: {admin_source}"
          admin = Path("build/admin-debug.apk")
          copy2(admin_source, admin)
          with ZipFile(game) as z:
              names = set(z.namelist())
              assert "classes.dex" in names, "DEX do jogo ausente"
              assert "lib/arm64-v8a/libbattleuniverse.so" in names, "Biblioteca ARM64 ausente"
              assert "lib/armeabi-v7a/libbattleuniverse.so" in names, "Biblioteca ARMv7 ausente"
              assert z.testzip() is None, "APK do jogo corrompido"
          with ZipFile(admin) as z:
              assert "classes.dex" in z.namelist(), "DEX do admin ausente"
              assert z.testzip() is None, "APK administrativo corrompido"
          print(f"Jogo: {game.stat().st_size} bytes; Admin: {admin.stat().st_size} bytes")
          PY
          ls -lh app/build/outputs/apk/debug/app-debug.apk build/admin-debug.apk
          ls -lh build/battle-universe-season-02-pack.zip
          test $(stat -c%s build/battle-universe-season-02-pack.zip) -ge 262144000
      - name: Publish verified Season 02 4K data pack
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: data-pack-v2
          name: Battle Universe — Conteúdo Expandido 4K
          body: |
            Pacote expandido do Battle Universe.
            Inclui avião de transporte, modelos OBJ, materiais PBR 4K, oito mapas,
            missões, shaders OpenGL ES 3.0 e quatro ambientes de áudio.
            O aplicativo valida o SHA-256 do pacote e de cada arquivo antes da instalação.
          prerelease: true
          files: |
            build/battle-universe-season-02-pack.zip
            build/content-pack-manifest.json
          overwrite_files: true
          fail_on_unmatched_files: true
      - name: Upload game APK
        uses: actions/upload-artifact@v4
        with:
          name: BATTLE-UNIVERSE-game-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload administration APK
        uses: actions/upload-artifact@v4
        with:
          name: BATTLE-UNIVERSE-ADMIN-debug-apk
          path: build/admin-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Season 02 4K package artifact
        uses: actions/upload-artifact@v4
        with:
          name: BATTLE-UNIVERSE-season-02-4k-content-pack
          path: |
            build/battle-universe-season-02-pack.zip
            build/content-pack-manifest.json
          if-no-files-found: error
          retention-days: 14
