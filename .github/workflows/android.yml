name: BATTLE UNIVERSE Android

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: battle-universe-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Native Android build, validation and content pack
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Firebase configuration (optional)
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$FIREBASE_GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > app/google-services.json
            python -m json.tool app/google-services.json > /dev/null
            echo "Firebase configuration loaded for this build."
          else
            echo "Firebase not configured: this APK remains playable offline."
          fi

      - name: Configure stable production signing
        env:
          BATTLE_UNIVERSE_KEYSTORE_BASE64: ${{ secrets.BATTLE_UNIVERSE_KEYSTORE_BASE64 }}
          BATTLE_UNIVERSE_KEYSTORE_PASSWORD: ${{ secrets.BATTLE_UNIVERSE_KEYSTORE_PASSWORD }}
          BATTLE_UNIVERSE_KEY_ALIAS: ${{ secrets.BATTLE_UNIVERSE_KEY_ALIAS }}
          BATTLE_UNIVERSE_KEY_PASSWORD: ${{ secrets.BATTLE_UNIVERSE_KEY_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/battle-universe-release.jks"
          VALUES=("$BATTLE_UNIVERSE_KEYSTORE_BASE64" "$BATTLE_UNIVERSE_KEYSTORE_PASSWORD" "$BATTLE_UNIVERSE_KEY_ALIAS" "$BATTLE_UNIVERSE_KEY_PASSWORD")
          PRESENT=0
          for value in "${VALUES[@]}"; do
            if [ -n "$value" ]; then PRESENT=$((PRESENT + 1)); fi
          done
          if [ "$PRESENT" -eq 0 ]; then
            echo "BU_RELEASE_SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "Stable release key not configured; production APK will not be published."
          elif [ "$PRESENT" -ne 4 ]; then
            echo "::error::Production signing requires all four BATTLE_UNIVERSE signing secrets."
            exit 1
          else
            printf '%s' "$BATTLE_UNIVERSE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE"
            test -s "$KEYSTORE"
            {
              echo "BU_KEYSTORE_PATH=$KEYSTORE"
              echo "BU_KEYSTORE_PASSWORD=$BATTLE_UNIVERSE_KEYSTORE_PASSWORD"
              echo "BU_KEY_ALIAS=$BATTLE_UNIVERSE_KEY_ALIAS"
              echo "BU_KEY_PASSWORD=$BATTLE_UNIVERSE_KEY_PASSWORD"
              echo "BU_RELEASE_SIGNING_READY=true"
            } >> "$GITHUB_ENV"
            echo "Stable release keystore decoded."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate account API Python syntax
        run: python -m py_compile server/main.py

      - name: Install content pack tools
        run: python -m pip install --disable-pip-version-check numpy pillow

      - name: Build expanded Season 02 4K content package
        run: python scripts/build_content_pack.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify production keystore and alias
        if: env.BU_RELEASE_SIGNING_READY == 'true'
        run: |
          # Validate the store password independently before checking the alias.
          if ! keytool -list -keystore "$BU_KEYSTORE_PATH" -storepass "$BU_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/keystore-list.txt" 2> "$RUNNER_TEMP/keystore-error.txt"; then
            cat "$RUNNER_TEMP/keystore-error.txt"
            echo "::error::The release keystore could not be opened. Check BATTLE_UNIVERSE_KEYSTORE_PASSWORD and confirm the uploaded JKS is the original signing key."
            exit 1
          fi

          # Print only public alias names if the configured alias does not exist.
          if ! keytool -list -keystore "$BU_KEYSTORE_PATH" -storepass "$BU_KEYSTORE_PASSWORD" -alias "$BU_KEY_ALIAS" > /dev/null 2> "$RUNNER_TEMP/alias-error.txt"; then
            cat "$RUNNER_TEMP/alias-error.txt"
            echo "::error::BATTLE_UNIVERSE_KEY_ALIAS does not match an entry in the keystore. Available entries:"
            grep -E '^[^[:space:]][^,]*, .* (PrivateKeyEntry|trustedCertEntry)' "$RUNNER_TEMP/keystore-list.txt" || cat "$RUNNER_TEMP/keystore-list.txt"
            exit 1
          fi

          echo "Production keystore password and alias verified."

      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1'

      - name: Add Android Build Tools and apkanalyzer to PATH
        shell: bash
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$BUILD_TOOLS/apksigner" || { echo "::error::apksigner is missing from $BUILD_TOOLS"; exit 1; }
          echo "$BUILD_TOOLS" >> "$GITHUB_PATH"
          ANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer -perm -u+x -print -quit)"
          test -n "$ANALYZER" || { echo "::error::apkanalyzer was not found in Android SDK"; exit 1; }
          echo "$(dirname "$ANALYZER")" >> "$GITHUB_PATH"
          echo "Android Build Tools and apkanalyzer paths configured."

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Android unit tests and compile debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Verify debug APK, DEX and native ARM libraries
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          assert apk.is_file() and apk.stat().st_size > 300_000, "APK ausente ou pequeno demais"
          with ZipFile(apk) as z:
              names = set(z.namelist())
              assert "classes.dex" in names, "classes.dex não encontrado"
              assert "lib/arm64-v8a/libbattleuniverse.so" in names, "Biblioteca ARM64 ausente"
              assert "lib/armeabi-v7a/libbattleuniverse.so" in names, "Biblioteca ARMv7 ausente"
              bad = z.testzip()
              assert bad is None, f"APK corrompido: {bad}"
          print(f"APK debug válido: {apk.stat().st_size} bytes; DEX e libs ARM presentes")
          PY
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          ls -lh build/battle-universe-season-02-pack.zip
          test $(stat -c%s build/battle-universe-season-02-pack.zip) -ge 262144000

      - name: Build production RELEASE APK
        if: env.BU_RELEASE_SIGNING_READY == 'true'
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify signed production RELEASE APK
        if: env.BU_RELEASE_SIGNING_READY == 'true'
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          command -v apksigner
          command -v apkanalyzer
          apksigner verify --verbose --print-certs "$APK"
          test "$(apkanalyzer manifest debuggable "$APK")" = "false"
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          apk = Path("app/build/outputs/apk/release/app-release.apk")
          with ZipFile(apk) as z:
              names = set(z.namelist())
              assert "classes.dex" in names, "classes.dex não encontrado"
              assert "lib/arm64-v8a/libbattleuniverse.so" in names, "Biblioteca ARM64 ausente"
              assert "lib/armeabi-v7a/libbattleuniverse.so" in names, "Biblioteca ARMv7 ausente"
              assert z.testzip() is None, "APK RELEASE corrompido"
          print(f"RELEASE assinado e íntegro: {apk.stat().st_size} bytes")
          PY

      - name: Publish verified Season 02 4K data pack
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: data-pack-v2
          name: Battle Universe — Conteúdo Expandido 4K
          body: |
            Pacote expandido do Battle Universe.
            Inclui avião de transporte, modelos OBJ, materiais PBR 4K, oito mapas,
            missões, shaders OpenGL ES 3.0 e quatro ambientes de áudio.
            O aplicativo valida o SHA-256 do pacote e de cada arquivo antes da instalação.
          prerelease: true
          files: |
            build/battle-universe-season-02-pack.zip
            build/content-pack-manifest.json
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BATTLE-UNIVERSE-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed production RELEASE APK artifact
        if: env.BU_RELEASE_SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BATTLE-UNIVERSE-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Season 02 4K package artifact
        uses: actions/upload-artifact@v4
        with:
          name: BATTLE-UNIVERSE-season-02-4k-content-pack
          path: |
            build/battle-universe-season-02-pack.zip
            build/content-pack-manifest.json
          if-no-files-found: error
          retention-days: 14
