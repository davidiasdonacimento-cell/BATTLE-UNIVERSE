plugins {
    id "com.android.application"
}

// Firebase is enabled only when the real project configuration is supplied.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

android {
    namespace "com.battleuniverse.game"
    compileSdk 35
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.battleuniverse.game"
        minSdk 24
        targetSdk 35
        versionCode 14
        versionName "1.2.1"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O2 -Wall -Wextra"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
        }
        release {
            minifyEnabled false
            debuggable false
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}


dependencies {
    implementation platform("com.google.firebase:firebase-bom:35.2.0")
    implementation "com.google.firebase:firebase-auth"
    implementation "com.google.firebase:firebase-firestore"

    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
}

// Optional stable signing key injected by GitHub Actions secrets.
// This keeps the APK signature consistent between CI builds and permits in-place updates.
def stableKeystorePath = System.getenv("BU_KEYSTORE_PATH")
if (stableKeystorePath != null && !stableKeystorePath.trim().isEmpty()) {
    android.signingConfigs.create("ciStable") {
        storeFile = file(stableKeystorePath)
        storePassword = System.getenv("BU_KEYSTORE_PASSWORD")
        keyAlias = System.getenv("BU_KEY_ALIAS")
        keyPassword = System.getenv("BU_KEY_PASSWORD")
    }
    android.buildTypes.debug.signingConfig = android.signingConfigs.getByName("ciStable")
}
