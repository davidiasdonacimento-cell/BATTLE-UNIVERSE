plugins {
    id "com.android.application"
}

// Firebase is enabled only when the real project configuration is supplied.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

android {
    namespace "com.battleuniverse.game"
    compileSdk 35
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.battleuniverse.game"
        minSdk 24
        targetSdk 35
        versionCode 17
        versionName "1.4.0"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O2 -Wall -Wextra"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
        }
        release {
            minifyEnabled false
            debuggable false
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:35.2.0")
    implementation "com.google.firebase:firebase-auth"
    implementation "com.google.firebase:firebase-firestore"

    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
}

// A release build is signed only with the user's stable keystore.
// Never silently publish a debug-signed APK as a production release.
def stableKeystorePath = System.getenv("BU_KEYSTORE_PATH")
def stableKeystorePassword = System.getenv("BU_KEYSTORE_PASSWORD")
def stableKeyAlias = System.getenv("BU_KEY_ALIAS")
def stableKeyPassword = System.getenv("BU_KEY_PASSWORD")
def hasStableSigning = [stableKeystorePath, stableKeystorePassword, stableKeyAlias, stableKeyPassword]
    .every { it != null && !it.trim().isEmpty() }

if (hasStableSigning) {
    android.signingConfigs.create("ciStable") {
        storeFile = file(stableKeystorePath)
        storePassword = stableKeystorePassword
        keyAlias = stableKeyAlias
        keyPassword = stableKeyPassword
    }
    android.buildTypes.release.signingConfig = android.signingConfigs.getByName("ciStable")
}
