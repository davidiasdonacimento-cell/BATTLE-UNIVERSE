plugins { id "com.android.application" }

android {
    namespace "com.battleuniverse.game"
    compileSdk 35
    ndkVersion "27.0.12077973"
    defaultConfig {
        applicationId "com.battleuniverse.game"
        minSdk 24
        targetSdk 35
        versionCode 18
        versionName "1.4.1"
        def accountApiUrl = System.getenv("ACCOUNT_API_BASE_URL")?.trim()
        if (!accountApiUrl) accountApiUrl = "https://battle-universe-accounts.onrender.com"
        buildConfigField "String", "ACCOUNT_API_BASE_URL", "\"" + accountApiUrl + "\""
        ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
        externalNativeBuild { cmake { cppFlags "-std=c++17 -O2 -Wall -Wextra"; arguments "-DANDROID_STL=c++_shared" } }
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { applicationIdSuffix ".debug"; versionNameSuffix "-debug"; debuggable true }
        release { minifyEnabled true; shrinkResources true; debuggable false; proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro" }
    }
    externalNativeBuild { cmake { path file("src/main/cpp/CMakeLists.txt"); version "3.22.1" } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets {
        main { assets.srcDir("$buildDir/generated/season02Assets") }
    }
    androidResources { noCompress += ["zip"] }
    packaging { jniLibs { useLegacyPackaging = false } }
}
dependencies {}
// Release builds must use the stable private key supplied through GitHub Actions secrets.
def stableKeystorePath = System.getenv("BU_KEYSTORE_PATH")
if (stableKeystorePath != null && !stableKeystorePath.trim().isEmpty()) {
    android.signingConfigs.create("ciStable") {
        storeFile = file(stableKeystorePath)
        storePassword = System.getenv("BU_KEYSTORE_PASSWORD")
        keyAlias = System.getenv("BU_KEY_ALIAS")
        keyPassword = System.getenv("BU_KEY_PASSWORD")
    }
    android.buildTypes.release.signingConfig = android.signingConfigs.getByName("ciStable")
}
